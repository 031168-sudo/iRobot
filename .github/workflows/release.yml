name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Creates (or reuses) a GitHub Release and attaches the APK, so the file
      # has a permanent download URL instead of a per-run artifact link.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          ASSET="MyRobot-${VERSION}.apk"
          LATEST="MyRobot.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          # Fixed-name copy so /releases/latest/download/MyRobot.apk always works.
          cp app/build/outputs/apk/debug/app-debug.apk "$LATEST"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "МойРобот ${VERSION}" --generate-notes
          gh release upload "$TAG" "$ASSET" "$LATEST" --clobber
          echo "Release: ${TAG}, assets: ${ASSET}, ${LATEST}"
